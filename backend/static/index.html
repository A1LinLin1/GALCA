<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>GALCA | 电网装备LCC分析</title>
  <!-- 引入 Vue 3, Element Plus, ECharts, Axios CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <script src="https://unpkg.com/element-plus"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>
  <script src="https://unpkg.com/echarts/dist/echarts.min.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <style>
    body { margin: 0; background-color: #f5f7fa; font-family: Helvetica, Arial, sans-serif; }
    .header { background-color: #001529; color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; height: 60px;}
    .logo { font-size: 24px; font-weight: bold; }
    .subtitle { font-size: 14px; color: #a6adb4; }
    .card-header { font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <div id="app">
    <el-container>
      <el-header class="header">
        <div class="logo">⚡ GALCA 工业智能体平台</div>
        <div class="subtitle">电网资产全寿命成本(LCC)多智能体分析系统</div>
      </el-header>
      <el-main style="padding: 20px;">
        <el-row :gutter="20">
          <el-col :span="8">
            <el-card class="box-card">
              <template #header>
                <div class="card-header"><span>📤 多模态数据摄取</span></div>
              </template>
              <el-upload
                drag action="/api/v1/upload" multiple
                :before-upload="handleUploadStart"
                :on-success="handleUploadSuccess"
              >
                <el-icon class="el-icon--upload"><Upload-Filled /></el-icon>
                <div class="el-upload__text">拖拽文件到此处，或 <em>点击上传</em></div>
              </el-upload>
              <el-alert v-if="taskStatus" :title="taskStatus" type="success" show-icon style="margin-top: 15px;" :closable="false" />
              <el-alert v-if="processing" title="智能体网络正在后台处理..." type="warning" show-icon style="margin-top: 10px;" :closable="false" />
            </el-card>
          </el-col>
          <el-col :span="16">
            <el-card class="box-card">
              <template #header>
                <div class="card-header">
                  <span>📈 LCC 成本拟合曲线</span>
                  <el-select v-model="selectedEquipment" @change="fetchForecast" placeholder="选择设备类型" style="width: 200px">
                    <el-option label="高压熔断器" value="高压熔断器"></el-option>
                    <el-option label="隔离开关" value="隔离开关"></el-option>
                    <el-option label="交流避雷器" value="交流避雷器"></el-option>
                    <el-option label="电缆终端" value="电缆终端"></el-option>
                    <el-option label="电缆" value="电缆"></el-option>
                    <el-option label="低压配电 0.6/1kV" value="低压配电 0.6/1kV"></el-option>
                  </el-select>
                </div>
              </template>
              <div id="lcc-chart" style="height: 350px;"></div>
            </el-card>
          </el-col>
        </el-row>
        <el-row style="margin-top: 20px;">
          <el-col :span="24">
            <el-card>
              <template #header>
                <div class="card-header">
                  <span>🗄️ 智能体提取的结构化台账</span>
                  <el-button type="primary" size="small" @click="fetchRecords">刷新数据</el-button>
                </div>
              </template>
              <el-table :data="tableData" border stripe>
                <el-table-column prop="equipment_type" label="设备类型"></el-table-column>
                <el-table-column prop="equipment_model" label="型号"></el-table-column>
                <el-table-column prop="cost_category" label="成本类别"></el-table-column>
                <el-table-column prop="amount" label="金额(万元)"></el-table-column>
                <el-table-column prop="date" label="发生日期"></el-table-column>
              </el-table>
            </el-card>
            <el-card class="box-card" style="margin-top: 20px;">
              <template #header>
                <div class="card-header"><span>📊 LCC 预测分析仪表盘</span>
                  <el-select v-model="selectedEquipment" @change="fetchForecast" placeholder="选择设备类型" style="width: 200px">
                    <el-option label="高压熔断器" value="高压熔断器"></el-option>
                    <el-option label="隔离开关" value="隔离开关"></el-option>
                    <el-option label="交流避雷器" value="交流避雷器"></el-option>
                    <el-option label="电缆终端" value="电缆终端"></el-option>
                    <el-option label="电缆" value="电缆"></el-option>
                  </el-select>
                </div>
              </template>
              <div id="lcc-chart" style="width: 100%; height: 400px;"></div>
            </el-card>
          </el-col>
        </el-row>
      </el-main>
    </el-container>
  </div>
  <script>
    const { createApp, ref, onMounted } = Vue;
    const App = {
      setup() {
        const taskStatus = ref('');
        const processing = ref(false);
        const tableData = ref([]);
        const selectedEquipment = ref('高压熔断器');

        const handleUploadStart = () => {
          processing.value = true;
          taskStatus.value = '';
        };

        const handleUploadSuccess = (response) => {
          taskStatus.value = response.message || '文件已接收，AI 分析引擎启动中...';
          
          let checkCount = 0;
          const checkTimer = setInterval(async () => {
             await fetchRecords();
             checkCount++;
             if(checkCount >= 5) {
                clearInterval(checkTimer);
                processing.value = false;
                taskStatus.value = '智能体流程执行完毕！';
             }
          }, 3000);
        };

        const fetchForecast = async () => {
          try {
            const forecastRes = await axios.get(`/api/v1/forecast/${selectedEquipment.value}`);
            if (forecastRes.data && forecastRes.data.data) {
              const predictions = JSON.parse(forecastRes.data.data.forecast_json);
              if (predictions && predictions.length > 0) {
                 const myChart = echarts.getInstanceByDom(document.getElementById('lcc-chart')) || echarts.init(document.getElementById('lcc-chart'));
                 myChart.setOption({
                   title: { text: `设备全生命周期预测 (${selectedEquipment.value}) - ${forecastRes.data.data.algo_used}` },
                   xAxis: { type: 'category', data: ['2020','2021','2022','2023','2024','2025','2026'] },
                   yAxis: { type: 'value', name: '成本(万元)' },
                   series: [{ data: predictions, type: 'line', smooth: true, areaStyle: { opacity: 0.3 } }]
                 });
              }
            } else {
               // 重置图表
               const myChart = echarts.getInstanceByDom(document.getElementById('lcc-chart')) || echarts.init(document.getElementById('lcc-chart'));
               myChart.clear();
               myChart.setOption({title: {text: `暂无 ${selectedEquipment.value} 的AI预测数据`}});
            }
          } catch (error) {
            console.error('预测数据获取失败', error);
          }
        };

        const fetchRecords = async () => {
          try {
            const res = await axios.get('/api/v1/records');
            tableData.value = res.data;
            await fetchForecast();
          } catch (error) {
            console.error('获取失败', error);
          }
        };

        const initChart = () => {
          const myChart = echarts.init(document.getElementById('lcc-chart'));
          myChart.setOption({ title: { text: '设备全生命周期预测 (请选择设备)' }});
        };

        onMounted(() => { initChart(); fetchRecords(); });

        return { taskStatus, processing, tableData, selectedEquipment, handleUploadStart, handleUploadSuccess, fetchRecords, fetchForecast };
      }
    };
    const app = createApp(App);
    app.use(ElementPlus);
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) { app.component(key, component); }
    app.mount('#app');
  </script>
</body>
</html>
